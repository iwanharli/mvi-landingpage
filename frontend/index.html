<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/img/logo-mvi.png" />

    <title>PT Mitra Verifikasi Indonesia — Global Conformity Partner</title>
    <meta
      name="description"
      content="MVI menyediakan solusi end-to-end Digital Product Passport (DPP) dan agregasi data rantai pasok untuk memastikan kepatuhan produk ekspor Indonesia terhadap regulasi Uni Eropa (ESPR & EU Battery Regulation)."
    />
    <meta name="theme-color" content="#0b2b46" />

    <!-- GANTI dengan domain produksi yang sebenarnya sebelum go-live.
         Nilai canonical/og diperbarui saat bahasa diganti (lihat LocaleContext). -->
    <link rel="canonical" href="https://mvi-id.com/" />

    <!-- Dua bahasa: Indonesia di root, Inggris di /en -->
    <link rel="alternate" hreflang="id" href="https://mvi-id.com/" />
    <link rel="alternate" hreflang="en" href="https://mvi-id.com/en" />
    <link rel="alternate" hreflang="x-default" href="https://mvi-id.com/" />

    <!-- Open Graph: LinkedIn, WhatsApp, Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="PT Mitra Verifikasi Indonesia" />
    <meta property="og:url" content="https://mvi-id.com/" />
    <meta
      property="og:title"
      content="PT Mitra Verifikasi Indonesia — Global Conformity Partner"
    />
    <meta
      property="og:description"
      content="Solusi end-to-end Digital Product Passport (DPP) dan agregasi data rantai pasok untuk kepatuhan produk ekspor Indonesia terhadap regulasi Uni Eropa."
    />
    <meta property="og:image" content="https://mvi-id.com/img/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Logo PT Mitra Verifikasi Indonesia — Global Conformity Partner"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="PT Mitra Verifikasi Indonesia — Global Conformity Partner"
    />
    <meta
      name="twitter:description"
      content="Solusi end-to-end Digital Product Passport (DPP) dan agregasi data rantai pasok untuk kepatuhan regulasi Uni Eropa."
    />
    <meta name="twitter:image" content="https://mvi-id.com/img/og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
